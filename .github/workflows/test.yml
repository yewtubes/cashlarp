name: Test and Docker build
on:
  push:
  pull_request:
concurrency:
  group: cashlarp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      - run: python tools/build_local.py && python tools/build_account.py
      - run: docker build -t cashlarp:test .
      - name: Start Docker image and check authenticated health
        shell: bash
        env:
          DOMAIN: cashlarp.example.com
        run: |
          set -euo pipefail
          export CASHLARP_ACCESS_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker compose up -d --build --wait --wait-timeout 120
          curl --fail --silent --user "cashlarp:$CASHLARP_ACCESS_PASSWORD" http://127.0.0.1:3000/api/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/login)" = 401
          docker compose -f compose.yaml -f compose.host.yaml config --quiet
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools outside project
        run: |
          npm install --prefix "$RUNNER_TEMP/cashlarp-browser" --no-package-lock playwright@1.62.1
          google-chrome --version
      - name: Test seasonal branding expiry
        run: node tools/verify_seasonal.cjs
      - name: Test original client signup and account pages
        run: node tools/verify_native_client.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cashlarp-browser/node_modules
          BROWSER_CHANNEL: chrome
          BROWSER_REPORT_DIR: ${{ runner.temp }}/cashlarp-browser-report
      - name: Upload original-client verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-client-browser-report
          path: ${{ runner.temp }}/cashlarp-browser-report

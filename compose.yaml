services:
  cashlarp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - cashlarp_data:/app/data
    environment:
      PORT: "3000"
      CASHLARP_ACCESS_USER: ${CASHLARP_ACCESS_USER:-cashlarp}
      CASHLARP_ACCESS_PASSWORD: ${CASHLARP_ACCESS_PASSWORD:-}
      CASHLARP_SECURE_COOKIES: ${CASHLARP_SECURE_COOKIES:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,base64,urllib.request; r=urllib.request.Request('http://127.0.0.1:3000/api/health'); r.add_header('Authorization','Basic '+base64.b64encode((os.environ.get('CASHLARP_ACCESS_USER','cashlarp')+':'+os.environ.get('CASHLARP_ACCESS_PASSWORD','')).encode()).decode()); urllib.request.urlopen(r,timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
volumes:
  cashlarp_data:

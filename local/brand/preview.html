<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cashlarp logo</title><style>body{font:16px system-ui;background:#f0f0f0;color:#111;padding:36px;margin:0}main{max-width:900px;margin:auto}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tile{padding:40px;border-radius:24px;text-align:center;background:white}.dark{background:#191919;color:white}.checker{background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.tile img{display:block;width:210px;height:210px;margin:0 auto 24px}.lockup{margin-top:20px;background:white;border-radius:24px;padding:36px}.lockup img{width:min(100%,600px)}h1{font-size:26px}p{margin:0;font-size:14px}@media(max-width:650px){.tiles{grid-template-columns:1fr}.tile img{width:150px;height:150px}}</style><main><h1>Cashlarp</h1><div class="tiles"><div class="tile checker"><img src="/local/brand/cashlarp-icon.svg" alt="Cashlarp icon on checkerboard"><p>Transparent exterior</p></div><div class="tile dark"><img src="/local/brand/cashlarp-icon.svg" alt="Cashlarp icon on dark"><p>Opaque green tile and white ₿</p></div></div><div class="lockup"><img src="/local/brand/cashlarp-wordmark.svg" alt="Cashlarp"></div></main></html>
